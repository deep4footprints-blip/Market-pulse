name: Deploy Worker

# Optional. Deploys worker/ to Cloudflare when it changes. Skips cleanly until you add the
# repo secrets CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID (Settings -> Secrets -> Actions).
on:
  push:
    branches: [main]
    paths: ["worker/**"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check for Cloudflare credentials
        id: gate
        run: |
          if [ -z "$CF_TOKEN" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "CLOUDFLARE_API_TOKEN not set - skipping Worker deploy."
          fi
      - uses: cloudflare/wrangler-action@v3
        if: steps.gate.outputs.skip != 'true'
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
